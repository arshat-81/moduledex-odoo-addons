<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-label="SQL Query and Report Builder banner">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="700" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#f8fafc"/>
            <stop offset="0.58" stop-color="#eff6ff"/>
            <stop offset="1" stop-color="#ecfdf5"/>
        </linearGradient>
        <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0f766e"/>
            <stop offset="1" stop-color="#0f172a"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#14b8a6"/>
            <stop offset="1" stop-color="#38bdf8"/>
        </linearGradient>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.16"/>
        </filter>
        <filter id="small-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
        </filter>
        <style>
            <![CDATA[
                .cursor {
                    animation: cursorBlink 1.1s steps(2, end) infinite;
                }
                .status-dot {
                    animation: statusPulse 2.8s ease-in-out infinite;
                    transform-origin: center;
                }
                .progress {
                    animation: progressBreath 3.8s ease-in-out infinite;
                    transform-origin: 1036px 304px;
                }
                .row-glow {
                    animation: rowGlow 4.2s ease-in-out infinite;
                }
                .line-one {
                    animation: codeGlow 5s ease-in-out infinite;
                }
                .line-two {
                    animation: codeGlow 5s ease-in-out infinite .35s;
                }
                .line-three {
                    animation: codeGlow 5s ease-in-out infinite .7s;
                }
                .spark {
                    animation: softFloat 5.5s ease-in-out infinite;
                }
                .spark.two {
                    animation-delay: 1.6s;
                }
                @keyframes cursorBlink {
                    0%, 45% { opacity: 1; }
                    46%, 100% { opacity: 0; }
                }
                @keyframes statusPulse {
                    0%, 100% { transform: scale(1); opacity: .82; }
                    50% { transform: scale(1.16); opacity: 1; }
                }
                @keyframes progressBreath {
                    0%, 100% { transform: scaleX(.72); }
                    50% { transform: scaleX(1); }
                }
                @keyframes rowGlow {
                    0%, 100% { opacity: .4; }
                    50% { opacity: 1; }
                }
                @keyframes codeGlow {
                    0%, 100% { opacity: .76; }
                    50% { opacity: 1; }
                }
                @keyframes softFloat {
                    0%, 100% { transform: translateY(0); opacity: .44; }
                    50% { transform: translateY(-8px); opacity: .9; }
                }
                @media (prefers-reduced-motion: reduce) {
                    * {
                        animation: none !important;
                    }
                }
            ]]>
        </style>
    </defs>

    <rect width="1400" height="700" rx="30" fill="url(#bg)"/>
    <g opacity="0.55">
        <path d="M90 106H1310M90 192H1310M90 278H1310M90 364H1310M90 450H1310M90 536H1310M90 622H1310" stroke="#dbeafe" stroke-width="1"/>
        <path d="M148 76V636M268 76V636M388 76V636M508 76V636M628 76V636M748 76V636M868 76V636M988 76V636M1108 76V636M1228 76V636" stroke="#ccfbf1" stroke-width="1"/>
    </g>

    <circle cx="1130" cy="122" r="142" fill="#ccfbf1" opacity=".48"/>
    <circle cx="96" cy="650" r="110" fill="#dbeafe" opacity=".48"/>

    <g transform="translate(104 96)">
        <rect x="0" y="0" width="1192" height="508" rx="34" fill="#ffffff" filter="url(#soft-shadow)"/>
        <rect x="0" y="0" width="1192" height="508" rx="34" fill="none" stroke="#e2e8f0"/>

        <g transform="translate(56 56)">
            <rect x="0" y="0" width="82" height="82" rx="22" fill="url(#brand)"/>
            <rect x="22" y="22" width="34" height="5" rx="2.5" fill="#f8fafc"/>
            <rect x="22" y="38" width="24" height="5" rx="2.5" fill="#f8fafc"/>
            <rect x="22" y="54" width="32" height="5" rx="2.5" fill="#f8fafc"/>
            <path d="M52 43l9 9 17-22" fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="35" cy="70" r="7" fill="#f8fafc"/>
            <path d="M40 75l13 13" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
        </g>

        <text x="56" y="172" fill="#0f172a" font-family="Arial, sans-serif" font-size="52" font-weight="800">SQL Query</text>
        <text x="56" y="226" fill="#0f172a" font-family="Arial, sans-serif" font-size="52" font-weight="800">&amp; Report Builder</text>
        <text x="58" y="282" fill="#475569" font-family="Arial, sans-serif" font-size="24">Saved queries, secure runs, CSV exports.</text>

        <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
            <rect x="58" y="322" width="124" height="34" rx="17" fill="#ecfdf5"/>
            <text x="82" y="345" fill="#0f766e">Odoo 17</text>
            <rect x="194" y="322" width="124" height="34" rx="17" fill="#eff6ff"/>
            <text x="218" y="345" fill="#0369a1">Odoo 18</text>
            <rect x="330" y="322" width="124" height="34" rx="17" fill="#f0fdfa"/>
            <text x="354" y="345" fill="#0f766e">Odoo 19</text>
        </g>

        <g transform="translate(58 384)" font-family="Arial, sans-serif">
            <g>
                <circle cx="14" cy="14" r="14" fill="#ccfbf1"/>
                <path d="M8 14l4 4 9-10" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <text x="38" y="20" fill="#334155" font-size="18" font-weight="700">Full-access control</text>
            </g>
            <g transform="translate(0 48)">
                <circle cx="14" cy="14" r="14" fill="#dbeafe"/>
                <path d="M7 14h14M14 7v14" stroke="#0369a1" stroke-width="3" stroke-linecap="round"/>
                <text x="38" y="20" fill="#334155" font-size="18" font-weight="700">CSV and preview output</text>
            </g>
            <g transform="translate(0 96)">
                <circle cx="14" cy="14" r="14" fill="#fef3c7"/>
                <path d="M14 7v8l6 3" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
                <text x="38" y="20" fill="#334155" font-size="18" font-weight="700">Local-time execution logs</text>
            </g>
        </g>

        <g transform="translate(568 66)" filter="url(#soft-shadow)">
            <rect x="0" y="0" width="560" height="386" rx="28" fill="#0f172a"/>
            <rect x="0" y="0" width="560" height="58" rx="28" fill="#111827"/>
            <rect x="0" y="30" width="560" height="28" fill="#111827"/>
            <circle cx="34" cy="29" r="7" fill="#fb7185"/>
            <circle cx="58" cy="29" r="7" fill="#fbbf24"/>
            <circle cx="82" cy="29" r="7" fill="#34d399"/>
            <text x="116" y="35" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">workbench_query.sql</text>

            <g font-family="'Courier New', monospace" font-size="20">
                <text class="line-one" x="34" y="102" fill="#e2e8f0">SELECT partner, total_amount</text>
                <text class="line-two" x="34" y="138" fill="#93c5fd">FROM monthly_sales_report</text>
                <text class="line-three" x="34" y="174" fill="#99f6e4">WHERE status = :state</text>
                <text x="34" y="210" fill="#cbd5e1">ORDER BY total_amount DESC</text>
                <rect class="cursor" x="360" y="191" width="11" height="25" fill="#5eead4"/>
            </g>

            <g transform="translate(34 244)">
                <rect x="0" y="0" width="492" height="104" rx="18" fill="#f8fafc"/>
                <rect x="0" y="0" width="492" height="42" rx="18" fill="#ecfeff"/>
                <rect x="0" y="24" width="492" height="18" fill="#ecfeff"/>
                <text x="24" y="27" fill="#0f766e" font-family="Arial, sans-serif" font-size="15" font-weight="700">Execution Preview</text>
                <circle class="status-dot" cx="158" cy="22" r="6" fill="#0f766e"/>
                <text x="174" y="27" fill="#0f766e" font-family="Arial, sans-serif" font-size="14" font-weight="700">success</text>
                <rect class="row-glow" x="16" y="58" width="460" height="28" rx="8" fill="#dbeafe"/>
                <line x1="154" y1="52" x2="154" y2="92" stroke="#e2e8f0"/>
                <line x1="312" y1="52" x2="312" y2="92" stroke="#e2e8f0"/>
                <text x="28" y="77" fill="#334155" font-family="Arial, sans-serif" font-size="14">Rows</text>
                <text x="178" y="77" fill="#334155" font-family="Arial, sans-serif" font-size="14">Duration</text>
                <text x="334" y="77" fill="#334155" font-family="Arial, sans-serif" font-size="14">Export</text>
                <text x="72" y="77" fill="#0f766e" font-family="Arial, sans-serif" font-size="14" font-weight="700">240</text>
                <text x="246" y="77" fill="#0f766e" font-family="Arial, sans-serif" font-size="14" font-weight="700">38 ms</text>
                <text x="392" y="77" fill="#0f766e" font-family="Arial, sans-serif" font-size="14" font-weight="700">CSV</text>
            </g>
        </g>

        <g transform="translate(936 262)" filter="url(#small-shadow)">
            <rect x="0" y="0" width="214" height="142" rx="22" fill="#ffffff"/>
            <text x="24" y="40" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="800">Access Guard</text>
            <rect x="24" y="68" width="166" height="16" rx="8" fill="#dbeafe"/>
            <rect class="progress" x="24" y="68" width="166" height="16" rx="8" fill="url(#accent)"/>
            <text x="24" y="114" fill="#475569" font-family="Arial, sans-serif" font-size="15">Admin approved</text>
        </g>
    </g>

    <g class="spark" fill="#14b8a6" opacity=".5">
        <path d="M1238 82l8 18 18 8-18 8-8 18-8-18-18-8 18-8z"/>
    </g>
    <g class="spark two" fill="#38bdf8" opacity=".5">
        <path d="M132 622l7 15 15 7-15 7-7 15-7-15-15-7 15-7z"/>
    </g>
</svg>
