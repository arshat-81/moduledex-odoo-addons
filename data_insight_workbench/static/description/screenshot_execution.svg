<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Data Insight execution result screenshot placement">
    <rect width="1200" height="675" fill="#f8fafc"/>
    <rect x="0" y="0" width="1200" height="56" fill="#0f172a"/>
    <text x="32" y="36" font-family="Arial, sans-serif" font-size="22" fill="#ffffff">Data Insight</text>
    <text x="190" y="36" font-family="Arial, sans-serif" font-size="16" fill="#99f6e4">Execution History</text>
    <rect x="36" y="92" width="1128" height="510" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="64" y="132" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Execution Result Preview</text>
    <text x="64" y="164" font-family="Arial, sans-serif" font-size="15" fill="#475569">Screenshot placement: localized execution title, success/error status, SQL tab, preview tab, and affected-row message.</text>
    <rect x="64" y="198" width="235" height="34" rx="17" fill="#ccfbf1"/>
    <text x="88" y="221" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#115e59">Success</text>
    <rect x="316" y="198" width="110" height="34" rx="17" fill="#fee2e2"/>
    <text x="342" y="221" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Error</text>
    <g font-family="Arial, sans-serif" font-size="16" fill="#0f172a">
        <text x="64" y="280">Name</text>
        <text x="210" y="280" font-weight="700">UPDATE completed at local user time</text>
        <text x="64" y="326">Mode</text>
        <text x="210" y="326">Run</text>
        <text x="64" y="372">Rows affected</text>
        <text x="210" y="372">1</text>
    </g>
    <rect x="64" y="418" width="1072" height="104" rx="8" fill="#fef3c7"/>
    <text x="88" y="455" font-family="Arial, sans-serif" font-size="16" fill="#92400e">UPDATE completed successfully. Rows affected: 1</text>
    <rect x="64" y="548" width="230" height="34" rx="17" fill="#e0f2fe"/>
    <text x="88" y="570" font-family="Arial, sans-serif" font-size="13" fill="#075985">Replace with real result screenshot.</text>
</svg>
